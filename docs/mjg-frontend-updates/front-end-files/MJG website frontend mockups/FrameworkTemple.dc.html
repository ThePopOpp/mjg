<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html.dark{--door:#4a453f;--bg:#141211;--card:#1f1c19;--muted:#1a1816;--hover:#2c2825;--border:#2c2825;--ink:#f4f1ea;--muted-fg:#a9a497;--gold-text:#d8bd86;--marble:#2a2623;--marble-hi:#3a3531;--marble-lo:#1f1c19;--cella:#0e0d0c;--flute:rgba(255,255,255,.07);--flute-dk:rgba(0,0,0,.35)}
:root{--door:#cfc9bd;--marble:#efeae0;--marble-hi:#faf7f0;--marble-lo:#dcd5c7;--cella:#1c1917;--flute:rgba(255,255,255,.55);--flute-dk:rgba(20,20,20,.12)}
body{margin:0;background:var(--bg,#fbfaf7);color:var(--ink,#1c1917);font-family:Geist,Arial,sans-serif}
@keyframes tmGlow{0%,100%{box-shadow:0 0 0 0 rgba(184,138,74,0),0 8px 28px rgba(184,138,74,.22)}50%{box-shadow:0 0 0 5px rgba(184,138,74,.14),0 12px 36px rgba(184,138,74,.4)}}
@keyframes tmPulse{0%,100%{box-shadow:0 0 0 4px rgba(184,138,74,.18);opacity:.95}50%{box-shadow:0 0 0 9px rgba(184,138,74,.08);opacity:.6}}
</style>
</helmet>
<div style="font-family:Geist,Arial,sans-serif;color:var(--ink,#1c1917);width:100%;max-width:640px;margin:0 auto;container-type:inline-size;" onMouseLeave="{{ leave }}" onMouseEnter="{{ enter }}">
  <div style="position:relative;width:100%;padding:0 0 6px;">

    <!-- PEDIMENT · LEGACY -->
    <button onMouseEnter="{{ legacy.hover }}" onClick="{{ legacy.click }}" aria-label="Legacy" style="position:relative;display:block;width:92%;margin:0 auto;height:140px;padding:0;border:none;background:none;cursor:pointer;font-family:inherit;opacity:{{ legacy.dim }};transition:opacity .3s,transform .3s;transform:{{ legacy.lift }};">
      <span style="position:absolute;inset:0;clip-path:polygon(50% 0,100% 100%,0 100%);background:{{ legacy.trim }};transition:background .25s;"></span>
      <span style="position:absolute;inset:4px 8px 0;clip-path:polygon(50% 0,100% 100%,0 100%);background:var(--marble);"></span>
      <span style="position:absolute;inset:14px 18px 8px;clip-path:polygon(50% 0,100% 100%,0 100%);background:var(--cella);"></span>
      <span style="position:absolute;left:calc(50% - 6px);top:-6px;width:12px;height:12px;border-radius:9999px;background:#b88a4a;animation:tmPulse 2.8s ease-in-out infinite;"></span>
      <span style="position:absolute;left:0;right:0;bottom:12px;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;">
        <span style="font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#d8bd86;">Legacy</span>
        <span style="font-size:10.5px;line-height:1.3;color:#cfc7ba;opacity:.85;max-width:56%;text-align:center;white-space:normal;">What your life multiplies through others now</span>
      </span>
    </button>

    <!-- ENTABLATURE: cornice + frieze (ENERGY) + architrave (KEYSTONE HABITS) -->
    <div style="width:100%;height:6px;background:var(--marble-hi);border:1px solid var(--border,#e1dbd0);border-bottom:none;border-radius:2px 2px 0 0;box-shadow:inset 0 -2px 0 var(--marble-lo);"></div>
    <button onMouseEnter="{{ energy.hover }}" onClick="{{ energy.click }}" style="position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;height:46px;padding:0 22px;border:1px solid {{ energy.border }};border-top:none;background:var(--cella);cursor:pointer;font-family:inherit;text-align:left;box-shadow:inset 0 0 0 1px rgba(184,138,74,.25),{{ energy.glow }};transition:box-shadow .25s,border-color .2s;animation:{{ energy.anim }};opacity:{{ energy.dim }};">
      <span style="position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,#b88a4a 30%,#d8bd86 50%,#b88a4a 70%,transparent);opacity:{{ energy.bar }};transition:opacity .25s;"></span>
      <span style="font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#d8bd86;white-space:nowrap;">Energy</span>
      <span style="font-size:12px;color:#cfc7ba;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;">Capacity to live it</span>
    </button>
    <button onMouseEnter="{{ habits.hover }}" onClick="{{ habits.click }}" style="position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;height:34px;padding:0 22px;border:1px solid {{ habits.border }};border-top:1px solid #b88a4a;background:var(--marble);cursor:pointer;font-family:inherit;text-align:left;box-shadow:{{ habits.glow }};transition:box-shadow .25s,border-color .2s;animation:{{ habits.anim }};opacity:{{ habits.dim }};">
      <span style="display:flex;align-items:center;gap:10px;white-space:nowrap;"><span style="display:flex;gap:3px;"><span style="width:5px;height:5px;border-radius:1px;background:#b88a4a;transform:rotate(45deg);"></span><span style="width:5px;height:5px;border-radius:1px;background:#b88a4a;transform:rotate(45deg);opacity:.65;"></span><span style="width:5px;height:5px;border-radius:1px;background:#b88a4a;transform:rotate(45deg);opacity:.35;"></span></span><span style="font-size:10.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--ink,#1c1917);">Keystone Habits</span></span>
      <span style="font-size:11.5px;color:var(--muted-fg,#6d6660);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;">Rhythms that strengthen</span>
    </button>

    <!-- COLONNADE: balustrade · 4 columns · balustrade -->
    <div style="position:relative;height:190px;padding:0 56px;margin-bottom:-1px;z-index:1;">
      <!-- cella wall behind -->
            <!-- COLUMNS -->
      <div style="position:relative;height:100%;display:flex;justify-content:space-evenly;align-items:stretch;">
        <sc-for list="{{ pillars }}" as="p" hint-placeholder-count="4">
          <button onMouseEnter="{{ p.hover }}" onClick="{{ p.click }}" aria-label="{{ p.label }}" style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:16%;min-width:44px;max-width:72px;padding:0;border:none;background:none;cursor:pointer;font-family:inherit;opacity:{{ p.dim }};transition:opacity .3s,transform .3s;transform:{{ p.lift }};">
            <span style="width:100%;height:10px;border-radius:3px 3px 1px 1px;background:var(--marble-hi);border:1px solid var(--border,#e1dbd0);box-shadow:0 2px 0 #b88a4a;"></span>
            <span style="width:78%;height:8px;border-radius:0 0 6px 6px;background:var(--marble);border:1px solid var(--border,#e1dbd0);border-top:none;"></span>
            <span style="position:relative;width:70%;flex:1;background-image:repeating-linear-gradient(90deg,var(--flute-dk) 0 2px,var(--marble) 2px 7px,var(--flute) 7px 9px,var(--marble) 9px 12px);background-color:var(--marble);border-left:1px solid var(--border,#e1dbd0);border-right:1px solid var(--border,#e1dbd0);box-shadow:inset -6px 0 10px -6px rgba(0,0,0,.25),{{ p.glow }};transition:box-shadow .25s;animation:{{ p.anim }};">
              <span style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(180deg);writing-mode:vertical-rl;font-family:Fraunces,Georgia,serif;font-size:15px;font-weight:600;letter-spacing:.04em;color:{{ p.text }};background:var(--marble);padding:6px 1px;border-radius:3px;white-space:nowrap;">{{ p.label }}</span>
            </span>
            <span style="width:84%;height:7px;border-radius:2px 2px 0 0;background:var(--marble);border:1px solid var(--border,#e1dbd0);border-bottom:none;"></span>
            <span style="width:100%;height:9px;border-radius:2px 2px 0 0;background:var(--marble-hi);border:1px solid var(--border,#e1dbd0);border-bottom:none;box-shadow:0 -2px 0 #b88a4a;"></span>
          </button>
        </sc-for>
      </div>

    </div>

    <!-- BASE: guardrail · foundation + bedrock · guardrail -->
    <div style="position:relative;display:grid;grid-template-columns:46px minmax(0,1fr) 46px;column-gap:10px;row-gap:0;align-items:start;margin-top:0;">
      <!-- GUARDRAIL LEFT -->
      <button onMouseEnter="{{ rail.hover }}" onClick="{{ rail.click }}" aria-label="Guardrails" style="position:relative;align-self:start;height:100px;margin-right:0;padding:0;border:1px solid {{ rail.border }};border-radius:4px;background:var(--marble);cursor:pointer;font-family:inherit;box-shadow:{{ rail.glow }};transition:box-shadow .25s,border-color .2s;animation:{{ rail.anim }};opacity:{{ rail.dim }};">
        <span style="position:absolute;left:6px;right:6px;top:10px;height:3px;border-radius:2px;background:#b88a4a;"></span>
        <span style="position:absolute;left:8px;right:8px;top:18px;bottom:14px;background-image:repeating-linear-gradient(90deg,var(--flute-dk) 0 4px,transparent 4px 11px);opacity:.9;"></span>
        <span style="position:absolute;left:6px;right:6px;bottom:8px;height:3px;border-radius:2px;background:#b88a4a;opacity:.6;"></span>
        <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);font-size:9.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:{{ rail.text }};background:var(--marble);padding:6px 0;margin:auto;height:max-content;width:max-content;border-radius:3px;">Guardrails</span>
      </button>

      <div style="min-width:0;">
    <!-- STYLOBATE · FOUNDATION -->
    <button onMouseEnter="{{ foundation.hover }}" onClick="{{ foundation.click }}" style="position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;height:48px;padding:0 22px;border:1px solid {{ foundation.border }};background:var(--marble-hi);cursor:pointer;font-family:inherit;text-align:left;box-shadow:inset 0 3px 0 var(--marble-lo),{{ foundation.glow }};transition:box-shadow .25s,border-color .2s;animation:{{ foundation.anim }};opacity:{{ foundation.dim }};">
      <span style="font-size:10.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--ink,#1c1917);white-space:nowrap;">Foundation</span>
      <span style="font-size:11.5px;color:var(--muted-fg,#6d6660);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;">Mission · Values · Calling · Purpose</span>
    </button>

    <!-- CREPIDOMA · BEDROCK (stepped, 2× foundation) -->
    <button onMouseEnter="{{ bedrock.hover }}" onClick="{{ bedrock.click }}" style="position:relative;display:block;width:100%;height:96px;padding:0;border:none;background:none;cursor:pointer;font-family:inherit;text-align:left;opacity:{{ bedrock.dim }};transition:opacity .3s;">
      <span style="position:absolute;left:0;right:0;top:0;height:52px;background:var(--cella);border:1px solid {{ bedrock.border }};border-radius:0;box-shadow:{{ bedrock.glow }};transition:box-shadow .25s;animation:{{ bedrock.anim }};"></span>
      <span style="position:absolute;left:-56px;right:-56px;top:52px;height:22px;background:var(--cella);border:1px solid {{ bedrock.border }};border-top:none;opacity:.92;"></span>
      <span style="position:absolute;left:-72px;right:-72px;top:74px;height:22px;background:var(--cella);border:1px solid {{ bedrock.border }};border-top:none;border-radius:0 0 6px 6px;opacity:.84;"></span>
      <span style="position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,#b88a4a,transparent);opacity:{{ bedrock.bar }};transition:opacity .25s;"></span>
      <span style="position:absolute;left:18px;right:18px;top:0;height:52px;display:flex;align-items:center;justify-content:space-between;gap:14px;pointer-events:none;">
        <span style="display:flex;flex-direction:column;gap:2px;white-space:nowrap;"><span style="font-size:10px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#d8bd86;">Bedrock</span><span style="font-family:Fraunces,Georgia,serif;font-size:clamp(15px,4.5cqw,19px);line-height:1.1;color:#f4f1ea;">Faith & Identity</span></span>
        <span style="font-size:10.5px;color:#cfc7ba;max-width:170px;text-align:right;line-height:1.35;min-width:0;overflow:hidden;display:{{ bedrock.capDisplay }};-webkit-line-clamp:2;-webkit-box-orient:vertical;">Not one room in the house — it shapes the entire structure.</span>
      </span>
    </button>
      </div>
      <!-- GUARDRAIL RIGHT -->
      <button onMouseEnter="{{ rail.hover }}" onClick="{{ rail.click }}" aria-label="Guardrails" style="position:relative;align-self:start;height:100px;margin-left:0;padding:0;border:1px solid {{ rail.border }};border-radius:4px;background:var(--marble);cursor:pointer;font-family:inherit;box-shadow:{{ rail.glow }};transition:box-shadow .25s,border-color .2s;animation:{{ rail.anim }};opacity:{{ rail.dim }};">
        <span style="position:absolute;left:6px;right:6px;top:10px;height:3px;border-radius:2px;background:#b88a4a;"></span>
        <span style="position:absolute;left:8px;right:8px;top:18px;bottom:14px;background-image:repeating-linear-gradient(90deg,var(--flute-dk) 0 4px,transparent 4px 11px);opacity:.9;"></span>
        <span style="position:absolute;left:6px;right:6px;bottom:8px;height:3px;border-radius:2px;background:#b88a4a;opacity:.6;"></span>
        <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-size:9.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:{{ rail.text }};background:var(--marble);padding:6px 0;margin:auto;height:max-content;width:max-content;border-radius:3px;">Guardrails</span>
      </button>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:680,&quot;height&quot;:560},&quot;autoplayMs&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3200,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:1500,&quot;max&quot;:8000,&quot;step&quot;:100,&quot;unit&quot;:&quot;ms&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(key: string) =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { hover: null, pinned: null, auto: 0, paused: false, visible: true, wide: true };
  componentDidMount() {
    this._root = (typeof document !== "undefined") ? null : null;
    this._tick = setInterval(() => { if (!this.state.paused && this.state.visible && !this.state.pinned && !this.state.hover) this.setState(s => ({ auto: (s.auto + 1) % 7 })); }, this.props.autoplayMs ?? 3200);
    if (typeof IntersectionObserver !== "undefined") {
      setTimeout(() => {
        const el = document.querySelector('[aria-label="Legacy"]');
        if (!el) return;
        this._io = new IntersectionObserver(([e]) => this.setState({ visible: e.isIntersecting }), { threshold: .3 });
        this._io.observe(el.parentElement);
        this._ro = new ResizeObserver(([e]) => this.setState({ wide: e.contentRect.width > 420 }));
        this._ro.observe(el.parentElement);
      }, 50);
    }
    this._emit();
  }
  componentDidUpdate(prev) {
    if (this.props.selectKey && this.props.selectKey !== this._sel) { this._sel = this.props.selectKey; const k = this.props.selectKey.split(":")[0]; this.setState({ pinned: k, auto: this.ORDER.indexOf(k) }); }
    this._emit();
  }
  _emit() {
    if (this.props.onTabs) { const key = this.activeKey(); if (this._lastTabs !== key) { this._lastTabs = key; } }
    const key = this.activeKey();
    if (this._last !== key) { this._last = key; if (this.props.onChange) this.props.onChange(key); }
  }
  componentWillUnmount() { clearInterval(this._tick); if (this._io) this._io.disconnect(); if (this._ro) this._ro.disconnect(); }
  activeKey() { return this.state.hover || this.state.pinned || this.ORDER[this.state.auto]; }
  ORDER = ["bedrock", "foundation", "pillars", "rail", "habits", "energy", "legacy"];
  renderVals() {
    const GOLD = "#b88a4a";
    const active = this.activeKey();
    const mk = (key) => {
      const on = active === key, pinned = this.state.pinned === key;
      return {
        hover: () => this.setState({ hover: key }),
        click: () => this.setState(s => ({ pinned: s.pinned === key ? null : key, auto: this.ORDER.indexOf(key) })),
        border: on ? GOLD : "var(--border,#e1dbd0)",
        glow: on ? "0 10px 30px rgba(184,138,74,.28)" : "0 1px 2px rgba(20,20,20,.06)",
        anim: pinned ? "tmGlow 2.2s ease-in-out infinite" : "none",
        dim: on ? 1 : .92,
        lift: "none",
        text: on ? GOLD : "var(--muted-fg,#6d6660)",
        bar: on ? 1 : .35,
        trim: on ? GOLD : "var(--marble-lo)",
      };
    };
    const P = ["Family", "Fitness", "Fun", "Finances"];
    const pillars = P.map(label => ({ label, ...mk("pillars"), text: active === "pillars" ? GOLD : "var(--ink,#1c1917)" }));
    const names = { bedrock: "Bedrock", foundation: "Foundation", pillars: "Four Pillars", rail: "Guardrails", habits: "Keystone Habits", energy: "Energy", legacy: "Legacy" };
    const tabs = this.ORDER.map((k, i) => ({ label: names[k], n: String(i + 1).padStart(2, "0"), border: active === k ? GOLD : "var(--border,#e1dbd0)", bg: active === k ? "rgba(184,138,74,.1)" : "var(--card,#fff)", color: active === k ? GOLD : "var(--ink,#1c1917)", num: active === k ? GOLD : "var(--muted-fg,#6d6660)", click: () => this.setState({ pinned: k, auto: i }) }));
    return {
      legacy: mk("legacy"), energy: mk("energy"), habits: mk("habits"), rail: mk("rail"), foundation: mk("foundation"), bedrock: { ...mk("bedrock"), capDisplay: this.state.wide ? "-webkit-box" : "none" }, pillars,
      enter: () => this.setState({ paused: true }), leave: () => this.setState({ paused: false, hover: null }),
    };
  }
}
</script>
</body>
</html>
